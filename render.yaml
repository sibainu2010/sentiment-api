services:
  - type: web
    name: sentiment-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('stopwords')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PATH
        value: model.pkl
